apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: static-pool
  namespace: metallb-system
spec:
  autoAssign: false
  addresses:
    - 10.8.30.100/32
    - 10.8.30.102/32
    - 10.8.30.103/32
    - 10.8.30.104/32
    - 10.8.30.105/32
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: dynamic-pool
  namespace: metallb-system
spec:
  autoAssign: true
  addresses:
    - 10.8.30.106-10.8.30.149
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: dynamic-l2adv
  namespace: metallb-system
spec:
  ipAddressPools:
    - dynamic-pool
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: static-l2adv
  namespace: metallb-system
spec:
  ipAddressPools:
    - static-pool
