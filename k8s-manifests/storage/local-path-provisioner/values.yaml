# Chart: local-path-provisioner/local-path-provisioner 0.0.38
image:
  repository: docker.io/rancher/local-path-provisioner
  tag: v0.0.37

helperImage:
  repository: docker.io/library/busybox
  tag: "1.38.0"

storageClass:
  create: true
  provisionerName: chunog.local/local-observability
  defaultClass: false
  defaultVolumeType: hostPath
  name: local-observability
  reclaimPolicy: Retain
  volumeBindingMode: WaitForFirstConsumer
nodePathMap:
  - node: worker01
    paths:
      - /var/lib/local-path-provisioner
  - node: worker02
    paths:
      - /var/lib/local-path-provisioner
  - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
    paths: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi
