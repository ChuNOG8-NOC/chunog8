- hosts: k8s_cluster
  become: true
  tasks:
    - name: swapをオフにする
      shell: swapoff -a
      changed_when: false

    - name: fstabのswap行をコメントアウト
      replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    - name: 必要なカーネルモジュールをロード
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: カーネルモジュールを永続化
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: sysctlパラメータ設定
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1

    - name: sysctl反映
      command: sysctl --system
      changed_when: false

    - name: 依存パッケージ導入
      apt:
        name:
          - curl
          - ca-certificates
          - apt-transport-https
          - gnupg
        update_cache: true

    - name: containerd導入
      apt:
        name: containerd
        state: present

    - name: containerd設定ディレクトリ作成
      file:
        path: /etc/containerd
        state: directory
        mode: '0755'

    - name: containerdのデフォルト設定生成
      shell: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: containerdでSystemdCgroupを有効化
      replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'
      notify: restart containerd

    - name: keyringsディレクトリ作成
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: kubernetes APTキー登録
      shell: |
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.36/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: kubernetes APTリポジトリ登録
      copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.36/deb/ /\n"

    - name: apt update
      apt:
        update_cache: true

    - name: kubelet/kubeadm/kubectl導入
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present

    - name: バージョン固定(apt-mark hold)
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

  handlers:
    - name: restart containerd
      service:
        name: containerd
        state: restarted
        enabled: true
