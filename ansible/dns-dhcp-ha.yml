- hosts: workers
  become: true
  tasks:
    - name: keepalived/Kea/Unbound導入
      apt:
        name:
          - keepalived
          - kea-dhcp4-server
          - unbound
        state: present
        update_cache: true

    - name: bind9が入っていれば削除
      apt:
        name: bind9
        state: absent

    - name: keepalived.conf配置
      template:
        src: templates/keepalived-dns-dhcp.conf.j2
        dest: /etc/keepalived/keepalived.conf

    - name: Unbound設定配置
      template:
        src: templates/unbound-dns.conf.j2
        dest: /etc/unbound/unbound.conf.d/dns.conf

    - name: Kea secondary設定配置
      template:
        src: templates/kea-dhcp4-secondary.conf.j2
        dest: /etc/kea/kea-dhcp4.conf

    - name: notifyスクリプト配置ディレクトリ作成
      file:
        path: /opt/dns-dhcp-ha
        state: directory
        mode: '0755'

    - name: notify-master.sh配置
      copy:
        src: templates/notify-master.sh
        dest: /opt/dns-dhcp-ha/notify-master.sh
        mode: '0755'

    - name: notify-backup.sh配置
      copy:
        src: templates/notify-backup.sh
        dest: /opt/dns-dhcp-ha/notify-backup.sh
        mode: '0755'

    - name: kea-dhcp4-server/unboundは普段停止(keepalivedが制御する)
      service:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - kea-dhcp4-server
        - unbound

    - name: keepalived有効化(起動状態は次のタスクで確定させる)
      service:
        name: keepalived
        enabled: true

    - name: keepalivedを必ず再起動しVRRP状態を再評価させる
      service:
        name: keepalived
        state: restarted

    - name: VRRP再選定を待つ
      ansible.builtin.pause:
        seconds: 5

    - name: MASTER側でサービスが起動してるか確認(失敗しても継続、目視確認用)
      ansible.builtin.command: systemctl is-active unbound
      register: unbound_active_check
      changed_when: false
      failed_when: false

    - name: 確認結果を表示
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: unbound = {{ unbound_active_check.stdout }}"
