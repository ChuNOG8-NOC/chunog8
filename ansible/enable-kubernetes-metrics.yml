---
- name: Prometheus向けにcontrol-plane metricsを公開
  hosts: control_plane
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tags:
    - control-plane-metrics
  vars:
    kubernetes_admin_kubeconfig: /etc/kubernetes/admin.conf
    static_pod_metrics_components:
      - name: kube-controller-manager
        manifest: /etc/kubernetes/manifests/kube-controller-manager.yaml
        regexp: '^(\s*-\s*--bind-address=).*$'
        replace: '\g<1>0.0.0.0'
      - name: kube-scheduler
        manifest: /etc/kubernetes/manifests/kube-scheduler.yaml
        regexp: '^(\s*-\s*--bind-address=).*$'
        replace: '\g<1>0.0.0.0'
      - name: etcd
        manifest: /etc/kubernetes/manifests/etcd.yaml
        regexp: '^(\s*-\s*--listen-metrics-urls=).*$'
        replace: '\g<1>http://127.0.0.1:2381,http://{{ ansible_host }}:2381'

  tasks:
    - name: Control-plane inventory IPを検証
      ansible.builtin.assert:
        that:
          - ansible_host | regex_search('^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$')
        fail_msg: >-
          {{ inventory_hostname }} の ansible_host にIPv4アドレスを指定してください。

    - name: Static Podのmetrics待受設定を順番に更新
      ansible.builtin.include_tasks: tasks/update-static-pod-metrics.yml
      loop: "{{ static_pod_metrics_components }}"
      loop_control:
        loop_var: metrics_component
        label: "{{ metrics_component.name }}"

- name: Prometheus向けにkube-proxy metricsを公開
  hosts: mgmt-vm
  become: false
  gather_facts: false
  any_errors_fatal: true
  tags:
    - kube-proxy-metrics
  vars:
    kube_proxy_metrics_bind_address: 0.0.0.0:10249

  tasks:
    - name: Kube-proxy ConfigMapを取得
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - kube-system
          - get
          - configmap
          - kube-proxy
          - -o
          - json
      register: kube_proxy_configmap_command
      changed_when: false
      check_mode: false

    - name: Kube-proxy設定を解析
      ansible.builtin.set_fact:
        kube_proxy_config_text: >-
          {{ (kube_proxy_configmap_command.stdout | from_json).data['config.conf'] }}

    - name: MetricsBindAddressキーの存在を検証
      ansible.builtin.assert:
        that:
          - kube_proxy_config_text | regex_search('(?m)^metricsBindAddress:.*$')
        fail_msg: kube-proxy ConfigMapのconfig.confにmetricsBindAddressがありません。

    - name: Kube-proxyの更新後設定を生成
      ansible.builtin.set_fact:
        kube_proxy_updated_config_text: >-
          {{ kube_proxy_config_text
             | regex_replace(
                 '(?m)^metricsBindAddress:.*$',
                 'metricsBindAddress: "' ~ kube_proxy_metrics_bind_address ~ '"'
               ) }}

    - name: Kube-proxy metrics待受設定を更新
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - kube-system
          - patch
          - configmap
          - kube-proxy
          - --type=merge
          - --patch
          - "{{ {'data': {'config.conf': kube_proxy_updated_config_text}} | to_json }}"
      register: kube_proxy_patch
      changed_when: true
      when:
        - not ansible_check_mode
        - kube_proxy_config_text != kube_proxy_updated_config_text

    - name: Kube-proxy DaemonSetを再起動 # noqa no-handler
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - kube-system
          - rollout
          - restart
          - daemonset/kube-proxy
      when: kube_proxy_patch.changed | default(false)
      changed_when: true

    - name: Kube-proxy rollout完了を待機 # noqa no-handler
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - kube-system
          - rollout
          - status
          - daemonset/kube-proxy
          - --timeout=180s
      changed_when: false
      when: kube_proxy_patch.changed | default(false)

    - name: Kube-proxy PodのReady数を取得
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - kube-system
          - get
          - daemonset
          - kube-proxy
          - -o
          - json
      register: kube_proxy_daemonset_command
      changed_when: false
      check_mode: false

    - name: 全kube-proxy PodがReadyであることを検証
      ansible.builtin.assert:
        that:
          - >-
            (kube_proxy_daemonset_command.stdout | from_json).status.desiredNumberScheduled
            == (kube_proxy_daemonset_command.stdout | from_json).status.numberReady
        fail_msg: kube-proxy DaemonSetの一部PodがReadyではありません。
